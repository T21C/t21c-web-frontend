<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Universal Forums</title>
    <meta name="description" content="A community specialized in custom levels & clears of A Dance of Fire and Ice.">
    <link rel="canonical" href="https://tuforums.com/" />
    <!-- ES2022 polyfills for older browsers (Cloudflare beacon + Sentry web-vitals) -->
    <script>
      (function () {
        if (!Array.prototype.at) {
          Array.prototype.at = function at(n) {
            n = Math.trunc(n) || 0;
            if (n < 0) n += this.length;
            if (n < 0 || n >= this.length) return undefined;
            return this[n];
          };
        }
        // Cloudflare beacon.min.js calls .at() on PerformanceEntryList from getEntriesByType
        if (
          typeof PerformanceEntryList !== 'undefined' &&
          PerformanceEntryList.prototype &&
          !PerformanceEntryList.prototype.at
        ) {
          PerformanceEntryList.prototype.at = Array.prototype.at;
        }
        if (!Object.hasOwn) {
          Object.hasOwn = function hasOwn(obj, prop) {
            return Object.prototype.hasOwnProperty.call(Object(obj), prop);
          };
        }
      })();
    </script>
  </head>
  <style>
    .background {
      position: fixed;
      inset: 0;
      z-index: 1;
      opacity: 0.9;
      background-image: url("/src/assets/important/dark/background-blurred.jpg");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-color: #000;
      -webkit-user-select: none;
      -khtml-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
    }
    .root {
      z-index: 2;
      position: relative;
    }
  </style>
  <body>
    <div class="background"></div>
    <div class="root" id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
