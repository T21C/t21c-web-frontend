name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    concurrency:
      group: frontend-ci-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Check production build secrets
        env:
          FRONTEND_BUILD_ENV: ${{ secrets.FRONTEND_BUILD_ENV_PRODUCTION }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_CDN_URL: ${{ vars.VITE_CDN_URL }}
          VITE_OWN_URL: ${{ vars.VITE_OWN_URL }}
          SENTRY_SKIP_UPLOAD: ${{ vars.SENTRY_SKIP_UPLOAD }}
        run: |
          set -euo pipefail
          [[ -n "${FRONTEND_BUILD_ENV}" ]] || { echo "FRONTEND_BUILD_ENV_PRODUCTION is empty" >&2; exit 1; }
          [[ -n "${VITE_SENTRY_DSN}" ]] || { echo "secret VITE_SENTRY_DSN is empty" >&2; exit 1; }
          [[ -n "${VITE_API_URL}" ]] || { echo "var VITE_API_URL is empty" >&2; exit 1; }
          [[ -n "${VITE_CDN_URL}" ]] || { echo "var VITE_CDN_URL is empty" >&2; exit 1; }
          [[ -n "${VITE_OWN_URL}" ]] || { echo "var VITE_OWN_URL is empty" >&2; exit 1; }
          case "${SENTRY_SKIP_UPLOAD,,}" in
            1|true|yes|on) ;;
            *)
              [[ -n "${SENTRY_AUTH_TOKEN}" ]] || { echo "secret SENTRY_AUTH_TOKEN is empty (set vars.SENTRY_SKIP_UPLOAD=true to opt out)" >&2; exit 1; }
              ;;
          esac

      - name: Prepare frontend build env
        id: frontend_env
        env:
          FRONTEND_BUILD_ENV: ${{ secrets.FRONTEND_BUILD_ENV_PRODUCTION }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_CDN_URL: ${{ vars.VITE_CDN_URL }}
          VITE_OWN_URL: ${{ vars.VITE_OWN_URL }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
          SENTRY_URL: ${{ vars.SENTRY_URL }}
          SENTRY_SKIP_UPLOAD: ${{ vars.SENTRY_SKIP_UPLOAD }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/frontend.env.production"
          skip_upload=false
          case "${SENTRY_SKIP_UPLOAD,,}" in
            1|true|yes|on) skip_upload=true ;;
          esac
          # Same merge as deploy; upload required unless vars.SENTRY_SKIP_UPLOAD=true.
          printf '%s\n' "$FRONTEND_BUILD_ENV" | grep -vE '^(SENTRY_|VITE_SENTRY_DSN|GITHUB_SHA|VITE_API_URL=|VITE_CDN_URL=|VITE_OWN_URL=)' >"$out" || true
          {
            printf 'VITE_API_URL=%s\n' "$VITE_API_URL"
            printf 'VITE_CDN_URL=%s\n' "$VITE_CDN_URL"
            printf 'VITE_OWN_URL=%s\n' "$VITE_OWN_URL"
            printf 'VITE_SENTRY_DSN=%s\n' "$VITE_SENTRY_DSN"
            printf 'SENTRY_ORG=%s\n' "${SENTRY_ORG:-the-universal-forums}"
            printf 'SENTRY_PROJECT=%s\n' "${SENTRY_PROJECT:-javascript-react}"
            if [[ -n "${SENTRY_URL}" ]]; then
              printf 'SENTRY_URL=%s\n' "$SENTRY_URL"
            fi
            printf 'GITHUB_SHA=%s\n' "$RELEASE_SHA"
            printf 'SENTRY_RELEASE=%s\n' "$RELEASE_SHA"
            if [[ "$skip_upload" == true ]]; then
              printf 'SENTRY_REQUIRE_UPLOAD=0\n'
            else
              printf 'SENTRY_AUTH_TOKEN=%s\n' "$SENTRY_AUTH_TOKEN"
              printf 'SENTRY_REQUIRE_UPLOAD=1\n'
            fi
          } >>"$out"
          hash=$(sha256sum -- "$out" | cut -d' ' -f1)
          printf 'path=%s\n' "$out" >>"$GITHUB_OUTPUT"
          printf 'hash=%s\n' "$hash" >>"$GITHUB_OUTPUT"

      - name: Install dependencies
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
          PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "true"
        run: npm ci

      - name: Lint
        run: npm run lint

      # Compile with production VITE_* origins. Strip the Sentry token so this
      # job cannot upload sourcemaps; the image build is the single uploader.
      - name: Build production assets
        env:
          FRONTEND_ENV_PATH: ${{ steps.frontend_env.outputs.path }}
        run: |
          set -euo pipefail
          grep -vE '^(SENTRY_AUTH_TOKEN=|SENTRY_REQUIRE_UPLOAD=)' "$FRONTEND_ENV_PATH" > .env.production
          printf 'SENTRY_REQUIRE_UPLOAD=0\n' >> .env.production
          npm run build:prod

  deploy:
    needs: validate
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    concurrency:
      group: tuf-frontend-production
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@v5

      - name: Set up QEMU
        if: ${{ runner.arch != 'ARM64' }}
        uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare frontend build env
        id: frontend_env
        env:
          FRONTEND_BUILD_ENV: ${{ secrets.FRONTEND_BUILD_ENV_PRODUCTION }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_CDN_URL: ${{ vars.VITE_CDN_URL }}
          VITE_OWN_URL: ${{ vars.VITE_OWN_URL }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
          SENTRY_URL: ${{ vars.SENTRY_URL }}
          SENTRY_SKIP_UPLOAD: ${{ vars.SENTRY_SKIP_UPLOAD }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ -n "${FRONTEND_BUILD_ENV}" ]] || { echo "FRONTEND_BUILD_ENV_PRODUCTION is empty" >&2; exit 1; }
          [[ -n "${VITE_SENTRY_DSN}" ]] || { echo "secret VITE_SENTRY_DSN is empty" >&2; exit 1; }
          [[ -n "${VITE_API_URL}" ]] || { echo "var VITE_API_URL is empty" >&2; exit 1; }
          [[ -n "${VITE_CDN_URL}" ]] || { echo "var VITE_CDN_URL is empty" >&2; exit 1; }
          [[ -n "${VITE_OWN_URL}" ]] || { echo "var VITE_OWN_URL is empty" >&2; exit 1; }
          skip_upload=false
          case "${SENTRY_SKIP_UPLOAD,,}" in
            1|true|yes|on) skip_upload=true ;;
          esac
          if [[ "$skip_upload" != true ]]; then
            [[ -n "${SENTRY_AUTH_TOKEN}" ]] || { echo "secret SENTRY_AUTH_TOKEN is empty (set vars.SENTRY_SKIP_UPLOAD=true to opt out)" >&2; exit 1; }
          fi
          out="${RUNNER_TEMP}/frontend.env.production"
          # Vite flags from the secret; public origins and Sentry come from discrete vars/secrets.
          printf '%s\n' "$FRONTEND_BUILD_ENV" | grep -vE '^(SENTRY_|VITE_SENTRY_DSN|GITHUB_SHA|VITE_API_URL=|VITE_CDN_URL=|VITE_OWN_URL=)' >"$out" || true
          {
            printf 'VITE_API_URL=%s\n' "$VITE_API_URL"
            printf 'VITE_CDN_URL=%s\n' "$VITE_CDN_URL"
            printf 'VITE_OWN_URL=%s\n' "$VITE_OWN_URL"
            printf 'VITE_SENTRY_DSN=%s\n' "$VITE_SENTRY_DSN"
            printf 'SENTRY_ORG=%s\n' "${SENTRY_ORG:-the-universal-forums}"
            printf 'SENTRY_PROJECT=%s\n' "${SENTRY_PROJECT:-javascript-react}"
            # Only set if var is present — must match token region (us vs de).
            if [[ -n "${SENTRY_URL}" ]]; then
              printf 'SENTRY_URL=%s\n' "$SENTRY_URL"
            fi
            printf 'GITHUB_SHA=%s\n' "$RELEASE_SHA"
            printf 'SENTRY_RELEASE=%s\n' "$RELEASE_SHA"
            if [[ "$skip_upload" == true ]]; then
              printf 'SENTRY_REQUIRE_UPLOAD=0\n'
            else
              printf 'SENTRY_AUTH_TOKEN=%s\n' "$SENTRY_AUTH_TOKEN"
              printf 'SENTRY_REQUIRE_UPLOAD=1\n'
            fi
          } >>"$out"
          hash=$(sha256sum -- "$out" | cut -d' ' -f1)
          printf 'path=%s\n' "$out" >>"$GITHUB_OUTPUT"
          printf 'hash=%s\n' "$hash" >>"$GITHUB_OUTPUT"

      - name: Build and push immutable production image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ghcr.io/t21c/t21c-web-frontend:${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            FRONTEND_ENV_HASH=${{ steps.frontend_env.outputs.hash }}
          secret-files: |
            frontend_env=${{ steps.frontend_env.outputs.path }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Connect to Tailscale
        if: ${{ vars.PRODUCTION_DEPLOY_ENABLED == 'true' }}
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:gh-runner
          ping: ${{ vars.TUF_DEPLOY_HOST }}

      - name: Configure deploy SSH identity
        if: ${{ vars.PRODUCTION_DEPLOY_ENABLED == 'true' }}
        env:
          DEPLOY_KEY: ${{ secrets.TUF_DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.TUF_DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          install -m 600 /dev/null ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          install -m 600 /dev/null ~/.ssh/known_hosts
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Deploy frontend production
        if: ${{ vars.PRODUCTION_DEPLOY_ENABLED == 'true' }}
        env:
          DEPLOY_HOST: ${{ vars.TUF_DEPLOY_HOST }}
        run: |
          set -euo pipefail
          [[ -n "$DEPLOY_HOST" ]] || { echo "Repository variable TUF_DEPLOY_HOST is required" >&2; exit 64; }
          ssh -i ~/.ssh/id_ed25519 "tuf-deploy@${DEPLOY_HOST}" \
            "sudo /srv/tuf/infra/bin/tuf-deploy-frontend '${{ github.sha }}'"
