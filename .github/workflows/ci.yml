name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Build production assets
        # CI only validates the build. Sourcemap upload runs on deploy/promote.
        env:
          VITE_PROD_API_URL: http://127.0.0.1:13000
        run: npm run build:prod

      - uses: docker/setup-buildx-action@v3

      - name: Build container image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: ghcr.io/t21c/t21c-web-frontend:ci
          secrets: |
            "frontend_env=VITE_PROD_API_URL=http://127.0.0.1:13000"
          cache-from: type=gha
          cache-to: type=gha,mode=max
