name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Check production build secrets
        env:
          FRONTEND_BUILD_ENV: ${{ secrets.FRONTEND_BUILD_ENV_PRODUCTION }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_CDN_URL: ${{ vars.VITE_CDN_URL }}
          VITE_OWN_URL: ${{ vars.VITE_OWN_URL }}
          SENTRY_SKIP_UPLOAD: ${{ vars.SENTRY_SKIP_UPLOAD }}
        run: |
          set -euo pipefail
          [[ -n "${FRONTEND_BUILD_ENV}" ]] || { echo "FRONTEND_BUILD_ENV_PRODUCTION is empty" >&2; exit 1; }
          [[ -n "${VITE_SENTRY_DSN}" ]] || { echo "secret VITE_SENTRY_DSN is empty" >&2; exit 1; }
          [[ -n "${VITE_API_URL}" ]] || { echo "var VITE_API_URL is empty" >&2; exit 1; }
          [[ -n "${VITE_CDN_URL}" ]] || { echo "var VITE_CDN_URL is empty" >&2; exit 1; }
          [[ -n "${VITE_OWN_URL}" ]] || { echo "var VITE_OWN_URL is empty" >&2; exit 1; }
          case "${SENTRY_SKIP_UPLOAD,,}" in
            1|true|yes|on) ;;
            *)
              [[ -n "${SENTRY_AUTH_TOKEN}" ]] || { echo "secret SENTRY_AUTH_TOKEN is empty (set vars.SENTRY_SKIP_UPLOAD=true to opt out)" >&2; exit 1; }
              ;;
          esac

      - name: Prepare frontend build env
        id: frontend_env
        env:
          FRONTEND_BUILD_ENV: ${{ secrets.FRONTEND_BUILD_ENV_PRODUCTION }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_CDN_URL: ${{ vars.VITE_CDN_URL }}
          VITE_OWN_URL: ${{ vars.VITE_OWN_URL }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
          SENTRY_URL: ${{ vars.SENTRY_URL }}
          SENTRY_SKIP_UPLOAD: ${{ vars.SENTRY_SKIP_UPLOAD }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/frontend.env.production"
          skip_upload=false
          case "${SENTRY_SKIP_UPLOAD,,}" in
            1|true|yes|on) skip_upload=true ;;
          esac
          # Same merge as deploy; upload required unless vars.SENTRY_SKIP_UPLOAD=true.
          printf '%s\n' "$FRONTEND_BUILD_ENV" | grep -vE '^(SENTRY_|VITE_SENTRY_DSN|GITHUB_SHA|VITE_API_URL=|VITE_CDN_URL=|VITE_OWN_URL=)' >"$out" || true
          {
            printf 'VITE_API_URL=%s\n' "$VITE_API_URL"
            printf 'VITE_CDN_URL=%s\n' "$VITE_CDN_URL"
            printf 'VITE_OWN_URL=%s\n' "$VITE_OWN_URL"
            printf 'VITE_SENTRY_DSN=%s\n' "$VITE_SENTRY_DSN"
            printf 'SENTRY_ORG=%s\n' "${SENTRY_ORG:-the-universal-forums}"
            printf 'SENTRY_PROJECT=%s\n' "${SENTRY_PROJECT:-javascript-react}"
            if [[ -n "${SENTRY_URL}" ]]; then
              printf 'SENTRY_URL=%s\n' "$SENTRY_URL"
            fi
            printf 'GITHUB_SHA=%s\n' "$RELEASE_SHA"
            printf 'SENTRY_RELEASE=%s\n' "$RELEASE_SHA"
            if [[ "$skip_upload" == true ]]; then
              printf 'SENTRY_REQUIRE_UPLOAD=0\n'
            else
              printf 'SENTRY_AUTH_TOKEN=%s\n' "$SENTRY_AUTH_TOKEN"
              printf 'SENTRY_REQUIRE_UPLOAD=1\n'
            fi
          } >>"$out"
          hash=$(sha256sum -- "$out" | cut -d' ' -f1)
          printf 'path=%s\n' "$out" >>"$GITHUB_OUTPUT"
          printf 'hash=%s\n' "$hash" >>"$GITHUB_OUTPUT"

      - name: Install dependencies
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
          PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "true"
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build production assets
        env:
          VITE_PROD_API_URL: http://127.0.0.1:13000
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
        run: npm run build:prod

      - uses: docker/setup-buildx-action@v3

      - name: Build container image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: ghcr.io/t21c/t21c-web-frontend:ci
          build-args: |
            FRONTEND_ENV_HASH=${{ steps.frontend_env.outputs.hash }}
          secret-files: |
            frontend_env=${{ steps.frontend_env.outputs.path }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
