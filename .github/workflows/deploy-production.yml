      - name: Build and push immutable production image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/t21c/t21c-web-frontend:${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          secret-files: |
            frontend_env=${{ steps.frontend_env.outputs.path }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Connect to Tailscale
        if: ${{ vars.PRODUCTION_DEPLOY_ENABLED == 'true' }}
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:gh-runner
          ping: tuf-main-server

      - name: Configure deploy SSH identity
        if: ${{ vars.PRODUCTION_DEPLOY_ENABLED == 'true' }}
        env:
          DEPLOY_KEY: ${{ secrets.TUF_DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.TUF_DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          install -m 600 /dev/null ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          install -m 600 /dev/null ~/.ssh/known_hosts
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Deploy frontend production
        if: ${{ vars.PRODUCTION_DEPLOY_ENABLED == 'true' }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_ed25519 tuf-deploy@tuf-main-server \
            "sudo /srv/tuf/infra/bin/tuf-deploy-frontend '${{ github.sha }}'"
