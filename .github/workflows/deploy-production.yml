name: Build and deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: tuf-frontend-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare frontend build env
        id: frontend_env
        env:
          FRONTEND_BUILD_ENV: ${{ secrets.FRONTEND_BUILD_ENV_PRODUCTION }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ -n "${FRONTEND_BUILD_ENV}" ]] || { echo "FRONTEND_BUILD_ENV_PRODUCTION is empty" >&2; exit 1; }
          printf '%s\n' "$FRONTEND_BUILD_ENV" | grep -qE '^SENTRY_AUTH_TOKEN=.+' || {
            echo "FRONTEND_BUILD_ENV_PRODUCTION missing SENTRY_AUTH_TOKEN" >&2
            exit 1
          }
          printf '%s\n' "$FRONTEND_BUILD_ENV" | grep -qE '^VITE_SENTRY_DSN=.+' || {
            echo "FRONTEND_BUILD_ENV_PRODUCTION missing VITE_SENTRY_DSN" >&2
            exit 1
          }
          out="${RUNNER_TEMP}/frontend.env.production"
          printf '%s\n' "$FRONTEND_BUILD_ENV" | grep -vE '^(SENTRY_RELEASE|GITHUB_SHA|SENTRY_REQUIRE_UPLOAD)=' >"$out"
          {
            printf 'GITHUB_SHA=%s\n' "$RELEASE_SHA"
            printf 'SENTRY_RELEASE=%s\n' "$RELEASE_SHA"
            printf 'SENTRY_REQUIRE_UPLOAD=1\n'
          } >>"$out"
          echo "path=${out}" >>"$GITHUB_OUTPUT"

      - name: Build and push immutable production image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/t21c/t21c-web-frontend:${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          secret-files: |
            frontend_env=${{ steps.frontend_env.outputs.path }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Connect to Tailscale
        if: ${{ vars.PRODUCTION_DEPLOY_ENABLED == 'true' }}
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:gh-runner
          ping: tuf-main-server

      - name: Configure deploy SSH identity
        if: ${{ vars.PRODUCTION_DEPLOY_ENABLED == 'true' }}
        env:
          DEPLOY_KEY: ${{ secrets.TUF_DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.TUF_DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          install -m 600 /dev/null ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          install -m 600 /dev/null ~/.ssh/known_hosts
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Deploy frontend production
        if: ${{ vars.PRODUCTION_DEPLOY_ENABLED == 'true' }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_ed25519 tuf-deploy@tuf-main-server \
            "sudo /usr/local/sbin/tuf-deploy-frontend '${{ github.sha }}'"
