name: Build and deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: tuf-frontend-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push immutable production image
        uses: docker/build-push-action@v6
        env:
          FRONTEND_BUILD_ENV: ${{ secrets.FRONTEND_BUILD_ENV_PRODUCTION }}
        with:
          context: .
          push: true
          tags: ghcr.io/t21c/t21c-web-frontend:${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          secret-envs: |
            frontend_env=FRONTEND_BUILD_ENV
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:gh-runner
          ping: tuf-main-server

      - name: Configure deploy SSH identity
        env:
          DEPLOY_KEY: ${{ secrets.TUF_DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.TUF_DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          install -m 600 /dev/null ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          install -m 600 /dev/null ~/.ssh/known_hosts
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Deploy frontend production
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_ed25519 tuf-deploy@tuf-main-server \
            "sudo /usr/local/sbin/tuf-deploy-frontend '${{ github.sha }}'"
