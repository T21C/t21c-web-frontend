name: Build and promote production

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Canary-verified frontend git SHA
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: tuf-frontend-production
  cancel-in-progress: false

jobs:
  promote:
    environment: production
    runs-on: ubuntu-latest
    steps:
      - name: Validate source SHA
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "source_sha must be a full 40-character git SHA" >&2
            exit 64
          }

      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_sha }}

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push immutable production image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/t21c/t21c-web-frontend:${{ inputs.source_sha }}
          labels: org.opencontainers.image.revision=${{ inputs.source_sha }}
          secrets: |
            "frontend_env=${{ vars.FRONTEND_BUILD_ENV_PRODUCTION }}"
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:gh-runner
          ping: tuf-main-server

      - name: Configure deploy SSH identity
        env:
          DEPLOY_KEY: ${{ secrets.TUF_DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ vars.TUF_DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          install -m 600 /dev/null ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          install -m 600 /dev/null ~/.ssh/known_hosts
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Promote frontend
        env:
          IMAGE_TAG: ${{ inputs.source_sha }}
        run: |
          ssh -i ~/.ssh/id_ed25519 tuf-deploy@tuf-main-server \
            "sudo /usr/local/sbin/tuf-deploy-frontend '$IMAGE_TAG'"
