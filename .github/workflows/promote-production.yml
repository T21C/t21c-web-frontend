name: Build and promote production

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Canary-verified frontend git SHA
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: tuf-frontend-production
  cancel-in-progress: false

jobs:
  promote:
    environment: production
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '["ubuntu-latest"]') }}
    steps:
      - name: Validate source SHA
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "source_sha must be a full 40-character git SHA" >&2
            exit 64
          }

      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_sha }}

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare frontend build env
        id: frontend_env
        env:
          FRONTEND_BUILD_ENV: ${{ secrets.FRONTEND_BUILD_ENV_PRODUCTION }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
          SENTRY_URL: ${{ vars.SENTRY_URL }}
          SENTRY_SKIP_UPLOAD: ${{ vars.SENTRY_SKIP_UPLOAD }}
          RELEASE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          [[ -n "${FRONTEND_BUILD_ENV}" ]] || { echo "FRONTEND_BUILD_ENV_PRODUCTION is empty" >&2; exit 1; }
          [[ -n "${VITE_SENTRY_DSN}" ]] || { echo "secret VITE_SENTRY_DSN is empty" >&2; exit 1; }
          skip_upload=false
          case "${SENTRY_SKIP_UPLOAD,,}" in
            1|true|yes|on) skip_upload=true ;;
          esac
          if [[ "$skip_upload" != true ]]; then
            [[ -n "${SENTRY_AUTH_TOKEN}" ]] || { echo "secret SENTRY_AUTH_TOKEN is empty (set vars.SENTRY_SKIP_UPLOAD=true to opt out)" >&2; exit 1; }
          fi
          out="${RUNNER_TEMP}/frontend.env.production"
          printf '%s\n' "$FRONTEND_BUILD_ENV" | grep -vE '^(SENTRY_|VITE_SENTRY_DSN|GITHUB_SHA)=' >"$out" || true
          {
            printf 'VITE_SENTRY_DSN=%s\n' "$VITE_SENTRY_DSN"
            printf 'SENTRY_ORG=%s\n' "${SENTRY_ORG:-the-universal-forums}"
            printf 'SENTRY_PROJECT=%s\n' "${SENTRY_PROJECT:-javascript-react}"
            if [[ -n "${SENTRY_URL}" ]]; then
              printf 'SENTRY_URL=%s\n' "$SENTRY_URL"
            fi
            printf 'GITHUB_SHA=%s\n' "$RELEASE_SHA"
            printf 'SENTRY_RELEASE=%s\n' "$RELEASE_SHA"
            if [[ "$skip_upload" == true ]]; then
              printf 'SENTRY_REQUIRE_UPLOAD=0\n'
            else
              printf 'SENTRY_AUTH_TOKEN=%s\n' "$SENTRY_AUTH_TOKEN"
              printf 'SENTRY_REQUIRE_UPLOAD=1\n'
            fi
          } >>"$out"
          echo "path=${out}" >>"$GITHUB_OUTPUT"

      - name: Build and push immutable production image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/t21c/t21c-web-frontend:${{ inputs.source_sha }}
          labels: org.opencontainers.image.revision=${{ inputs.source_sha }}
          secret-files: |
            frontend_env=${{ steps.frontend_env.outputs.path }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:gh-runner
          ping: tuf-main-server

      - name: Configure deploy SSH identity
        env:
          DEPLOY_KEY: ${{ secrets.TUF_DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.TUF_DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          install -m 600 /dev/null ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          install -m 600 /dev/null ~/.ssh/known_hosts
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Promote frontend
        env:
          IMAGE_TAG: ${{ inputs.source_sha }}
        run: |
          ssh -i ~/.ssh/id_ed25519 tuf-deploy@tuf-main-server \
            "sudo /srv/tuf/infra/bin/tuf-deploy-frontend '$IMAGE_TAG'"
